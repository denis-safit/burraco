<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Burraco Foglio</title>
<meta name="theme-color" content="#0f5a3c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Burraco">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="../icon-192.png">
<link rel="manifest" href="../manifest.webmanifest">
<style>
/* VOICE: un foglio segnapunti di carta, grande e chiaro, per tutti
   IDEA: il blocchetto a quadretti accanto al mazzo
   PICTURE: la tabella stessa, con i totali enormi in fondo
   COLOUR and TYPE: carta bianca, inchiostro scuro, verde panno per i totali, rosso per i negativi; caratteri di sistema grandi
   LAYOUT: colonna unica, totali fissi in basso, tastierino gigante a scomparsa */
:root{color-scheme:light;--felt:#0f5a3c;--ink:#111;--mute:#555;--line:#cfd8d3;--red:#c8102e;--paper:#fff;--soft:#eef3f0}
*{box-sizing:border-box;min-width:0}
html,body{overscroll-behavior:none}
body{margin:0;background:var(--paper);color:var(--ink);font:20px/1.4 -apple-system,system-ui,sans-serif;-webkit-user-select:none;user-select:none;overflow-x:clip}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;font:inherit;cursor:pointer}
button:focus-visible{outline:3px solid #f2c14e;outline-offset:2px}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:calc(150px + env(safe-area-inset-bottom))}
header{background:var(--felt);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 14px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
header h1{margin:0;font-size:26px}
header button{background:none;border:2px solid rgba(255,255,255,.6);color:#fff;border-radius:12px;min-height:48px;padding:0 14px;font-size:18px;font-weight:600}
table{width:100%;border-collapse:collapse;table-layout:fixed}
th{position:sticky;top:0;background:var(--soft);font-size:20px;padding:12px 4px;border-bottom:3px solid var(--felt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
th.n,td.n{width:46px;color:var(--mute);font-size:17px;text-align:center}
th button{background:none;border:0;width:100%;min-height:44px;font-weight:700;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td{border-bottom:1px solid var(--line);border-left:1px solid var(--line);padding:0;text-align:center}
td button{width:100%;min-height:64px;border:0;background:none;font-size:30px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
td button.empty{color:#b9c4be;font-weight:400}
td button.neg{color:var(--red)}
td button.sel{background:#fff6d6;box-shadow:inset 0 0 0 3px #f2c14e}
.add{display:block;width:calc(100% - 28px);margin:16px 14px;min-height:64px;border:3px dashed var(--felt);border-radius:16px;background:none;color:var(--felt);font-size:22px;font-weight:700}
.hint{color:var(--mute);font-size:17px;text-align:center;padding:0 20px}
.tot{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:560px;background:var(--felt);color:#fff;display:flex;padding:10px 10px calc(10px + env(safe-area-inset-bottom));gap:6px;z-index:5}
.tot div{flex:1;text-align:center;border-radius:12px;padding:6px 4px}
.tot small{display:block;font-size:16px;opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tot b{display:block;font-size:44px;line-height:1.1;font-variant-numeric:tabular-nums}
.tot div.lead{background:#f2c14e;color:#111}
.tot b.neg{color:#ffb3bd}.tot .lead b.neg{color:var(--red)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:9}
.sheet.show{display:flex}
.pad{background:#fff;width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom))}
.who{text-align:center;font-size:20px;color:var(--mute)}.who b{color:var(--ink)}
.disp{text-align:center;font-size:64px;font-weight:800;line-height:1.1;margin:4px 0 10px;font-variant-numeric:tabular-nums}
.disp.neg{color:var(--red)}
.keys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.keys button{min-height:68px;border:0;border-radius:14px;background:var(--soft);font-size:34px;font-weight:700;color:var(--ink)}
.keys button:active{background:#d7e2dc}
.keys .minus{background:#fde3e7;color:var(--red);font-size:22px}
.keys .ok{grid-column:span 2;background:var(--felt);color:#fff;font-size:26px}
.row2{display:flex;gap:8px;margin-top:8px}
.row2 button{flex:1;min-height:52px;border:2px solid var(--line);border-radius:14px;background:#fff;font-size:18px;font-weight:600;color:var(--ink)}
.box{background:#fff;width:100%;max-width:460px;margin:auto 16px;border-radius:20px;padding:20px;align-self:center}
.box h2{margin:0 0 12px;font-size:24px}
.box input{width:100%;min-height:56px;font-size:22px;border:2px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:10px;-webkit-user-select:text;user-select:text}
.big{display:block;width:100%;min-height:60px;border:0;border-radius:14px;background:var(--felt);color:#fff;font-size:22px;font-weight:700;margin-top:8px}
.big.ghost{background:var(--soft);color:var(--ink)}
.big.red{background:var(--red)}
.cols{display:flex;gap:8px}.cols button{flex:1;min-height:60px;border-radius:14px;border:2px solid var(--line);background:#fff;font-size:22px;font-weight:700;color:var(--ink)}
.cols button.on{background:var(--felt);border-color:var(--felt);color:#fff}
.mode{display:inline-flex;background:rgba(0,0,0,.25);border-radius:14px;padding:3px}.mode a,.mode span{min-height:44px;display:inline-flex;align-items:center;padding:0 18px;border-radius:11px;font-size:20px;font-weight:700;color:#d6eadf;text-decoration:none}.mode .on{background:#fff;color:#0f5a3c}
.back{display:block;text-align:center;color:var(--mute);font-size:16px;margin:24px 0}
</style>
</head>
<body>
<div class="app">
  <header><div class="mode" role="group" aria-label="Versione"><span class="on">Light</span><a href="../" data-mode="pro">Pro</a></div><button id="menu">Nuova partita</button></header>
  <div id="sheetwrap"></div>
</div>
<div class="tot" id="tot"></div>
<div class="sheet" id="kp"></div>
<div class="sheet" id="dlg"></div>
<script>
{
const DEF=()=>({names:["Noi","Voi"],rows:[[null,null]]});
let G=DEF(),cur=null;
try{const s=JSON.parse(localStorage.getItem("burraco-foglio")||"null");if(s&&s.rows)G=s}catch(e){}
const save=()=>{try{localStorage.setItem("burraco-foglio",JSON.stringify(G))}catch(e){}};
const $=id=>document.getElementById(id);
const esc=t=>String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=v=>v==null?"·":v>0?"+"+v:String(v).replace("-","−");
const totals=()=>G.names.map((_,c)=>G.rows.reduce((a,r)=>a+(r[c]||0),0));

function render(){
  const n=G.names.length;
  $("sheetwrap").innerHTML=`<table><thead><tr><th class="n">#</th>${G.names.map((x,c)=>`<th><button data-name="${c}" aria-label="Cambia nome ${esc(x)}">${esc(x)}</button></th>`).join("")}</tr></thead>
  <tbody>${G.rows.map((r,i)=>`<tr><td class="n">${i+1}</td>${r.map((v,c)=>`<td><button data-cell="${i},${c}" class="${v==null?"empty":v<0?"neg":""} ${cur&&cur.r===i&&cur.c===c?"sel":""}">${fmt(v)}</button></td>`).join("")}</tr>`).join("")}</tbody></table>
  <button class="add" id="add">+ Nuova mano</button>
  <p class="hint">Tocca una casella per scrivere i punti della mano. Il numero può essere anche in meno.</p>`;
  const t=totals(),mx=Math.max(...t),any=G.rows.some(r=>r.some(v=>v!=null));
  $("tot").innerHTML=G.names.map((x,c)=>`<div class="${any&&t[c]===mx?"lead":""}"><small>${esc(x)}</small><b class="${t[c]<0?"neg":""}">${String(t[c]).replace("-","−")}</b></div>`).join("");
}
function openPad(r,c){
  cur={r,c,str:G.rows[r][c]==null?"":String(Math.abs(G.rows[r][c])),neg:(G.rows[r][c]||0)<0,fresh:true};
  $("kp").innerHTML=`<div class="pad"><div class="who">Mano ${r+1} · <b id="kpWho"></b></div><div class="disp" id="kpD">0</div>
  <div class="keys">${["1","2","3","4","5","6","7","8","9","minus","0","del"].map(k=>`<button data-k="${k}" class="${k==="minus"?"minus":""}">${k==="del"?"⌫":k==="minus"?"in meno ±":k}</button>`).join("")}
  <button data-k="clr" class="ghostk">Vuota</button><button data-k="ok" class="ok">OK</button></div>
  <div class="row2"><button data-k="close">Chiudi</button></div></div>`;
  $("kp").classList.add("show");upd();render();
}
function upd(){
  const v=+cur.str||0;$("kpWho").textContent=G.names[cur.c];
  const d=$("kpD");d.textContent=v?(cur.neg?"−":"")+v:"0";d.classList.toggle("neg",cur.neg&&v>0);
}
function commit(){G.rows[cur.r][cur.c]=cur.str===""?null:(cur.neg?-1:1)*(+cur.str||0);save()}
function closePad(){cur=null;$("kp").classList.remove("show");render()}
function dlg(html){$("dlg").innerHTML=`<div class="box">${html}</div>`;$("dlg").classList.add("show")}
function closeDlg(){$("dlg").classList.remove("show")}

try{localStorage.setItem("burraco-mode","light")}catch(e){}
document.addEventListener("click",e=>{
  const md=e.target.closest("[data-mode]");if(md){try{localStorage.setItem("burraco-mode",md.dataset.mode)}catch(_){}return}
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.cell){const[r,c]=b.dataset.cell.split(",").map(Number);openPad(r,c);return}
  if(b.id==="add"){G.rows.push(G.names.map(()=>null));save();openPad(G.rows.length-1,0);return}
  if(b.dataset.k!==undefined){const k=b.dataset.k;
    if(k==="close"){closePad();return}
    if(k==="ok"){commit();const n=G.names.length;
      if(cur.c<n-1){openPad(cur.r,cur.c+1)}else closePad();return}
    if(k==="del")cur.str=cur.str.slice(0,-1);
    else if(k==="minus"){cur.neg=!cur.neg;cur.sign=true}
    else if(k==="clr"){cur.str="";cur.neg=false}
    else{if(cur.fresh){cur.str="";if(!cur.sign)cur.neg=false}if(cur.str.length<4)cur.str=(cur.str+k).replace(/^0+(?=\d)/,"")}
    if(k!=="minus")cur.fresh=false;upd();return}
  if(b.dataset.name){const c=+b.dataset.name;
    dlg(`<h2>Nome della colonna</h2><input id="nm" maxlength="14" value="${esc(G.names[c])}"><button class="big" id="nmOk" data-c="${c}">Salva</button><button class="big ghost" id="x">Annulla</button>`);
    setTimeout(()=>{const i=$("nm");i.focus();i.select()},50);return}
  if(b.id==="nmOk"){const v=$("nm").value.trim();if(v)G.names[+b.dataset.c]=v;save();closeDlg();render();return}
  if(b.id==="menu"){
    dlg(`<h2>Nuova partita</h2><p style="margin:0 0 8px">Quante colonne?</p>
    <div class="cols">${[2,3,4].map(n=>`<button data-cols="${n}" class="${G.names.length===n?"on":""}">${n}</button>`).join("")}</div>
    <p class="hint" style="padding:8px 0 0;text-align:left">In 4 a coppie bastano 2 colonne.</p>
    <button class="big red" id="go">Cancella il foglio e ricomincia</button><button class="big ghost" id="x">Annulla</button>`);return}
  if(b.dataset.cols){document.querySelectorAll("[data-cols]").forEach(x=>x.classList.toggle("on",x===b));return}
  if(b.id==="go"){const n=+document.querySelector("[data-cols].on").dataset.cols;
    const old=G.names;G={names:n===old.length?old.slice():Array.from({length:n},(_,i)=>n===2?["Noi","Voi"][i]:"Giocatore "+(i+1)),rows:[Array(n).fill(null)]};
    save();closeDlg();render();return}
  if(b.id==="x"){closeDlg();return}
});
$("kp").addEventListener("click",e=>{if(e.target===$("kp"))closePad()});
$("dlg").addEventListener("click",e=>{if(e.target===$("dlg"))closeDlg()});
render();
if("serviceWorker" in navigator&&location.protocol==="https:"){try{navigator.serviceWorker.register("../sw.js").catch(()=>{})}catch(e){}}
}
</script>
</body>
</html>
